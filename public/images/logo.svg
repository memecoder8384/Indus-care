<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#154284"/>
      <stop offset="100%" stop-color="#1d5cb0"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8b5"/>
      <stop offset="100%" stop-color="#00d2d3"/>
    </linearGradient>
  </defs>

  <!-- Outer Double Arch Arc -->
  <path d="M 115,245 A 145,145 0 0,1 385,245" fill="none" stroke="#154284" stroke-width="2.5"/>
  <path d="M 125,245 A 135,135 0 0,1 375,245" fill="none" stroke="#154284" stroke-width="1.5" opacity="0.7"/>
  <line x1="100" y1="245" x2="140" y2="245" stroke="#154284" stroke-width="2.5"/>
  <line x1="360" y1="245" x2="400" y2="245" stroke="#154284" stroke-width="2.5"/>

  <!-- Left Dark Blue Hand -->
  <path d="M 230,230 C 190,230 165,190 175,140 C 185,100 205,80 205,80 C 205,80 185,110 185,145 C 185,175 205,210 240,215 C 260,218 280,225 285,240 C 275,232 250,230 230,230 Z" fill="url(#blueGrad)"/>

  <!-- Right Teal Hand -->
  <path d="M 270,230 C 310,230 335,190 325,140 C 315,100 295,80 295,80 C 295,80 315,110 315,145 C 315,175 295,210 260,215 C 240,218 220,225 215,240 C 225,232 250,230 270,230 Z" fill="url(#tealGrad)"/>

  <!-- Outer Caring Hands Circle Sweep -->
  <path d="M 200,120 C 180,140 180,180 200,210 C 220,235 260,235 280,210 C 290,195 290,175 280,160 C 270,145 250,145 240,160 C 235,170 240,185 250,190" fill="none" stroke="url(#blueGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 300,120 C 320,140 320,180 300,210 C 280,235 240,235 220,210 C 210,195 210,175 220,160 C 230,145 250,145 260,160 C 265,170 260,185 250,190" fill="none" stroke="url(#tealGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Central Heart Shape -->
  <path d="M 250,210 C 230,185 210,165 210,145 C 210,130 222,118 237,118 C 246,118 254,123 250,132 C 246,123 254,118 263,118 C 278,118 290,130 290,145 C 290,165 270,185 250,210 Z" fill="#154284"/>

  <!-- White Medical Cross -->
  <rect x="245" y="132" width="10" height="24" rx="2" fill="#FFFFFF"/>
  <rect x="238" y="139" width="24" height="10" rx="2" fill="#FFFFFF"/>

  <!-- River Path (S-Curve inside Heart/Base) -->
  <path d="M 235,210 Q 255,185 245,165 T 265,145" fill="none" stroke="#00d2d3" stroke-width="6" stroke-linecap="round"/>

  <!-- Text: INDUS CARE -->
  <text x="250" y="295" font-family="'Montserrat', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#154284" text-anchor="middle" letter-spacing="3">INDUS CARE</text>

  <!-- Text: FOUNDATION -->
  <text x="250" y="330" font-family="'Montserrat', 'Inter', sans-serif" font-size="22" font-weight="700" fill="#00a8b5" text-anchor="middle" letter-spacing="5">FOUNDATION</text>

  <!-- Divider Line -->
  <line x1="110" y1="352" x2="390" y2="352" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Subtitle Line -->
  <text x="250" y="372" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#7d8590" text-anchor="middle" letter-spacing="1.5">ESTABLISHED: 2020 | TYPE: NON-PROFIT ORGANIZATION</text>
</svg>
